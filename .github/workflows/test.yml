name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 runs these TypeScript tests directly by stripping types, with no
      # build step. Node 22 does not, and fails with MODULE_NOT_FOUND.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test